<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeYay! – Friday is Your Reward Day! | Telkomsel</title>
  <style>
    html, body { margin: 0; height: 100%; background: #15525f; }
    #view { border: 0; width: 100%; height: 100%; display: block; }
    .music-btn {
      position: fixed; right: 16px; bottom: 16px; z-index: 50;
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.8); border-radius: 999px;
      background: #fff8e7; color: #17313b;
      font: 700 13px/1 "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 6px 18px rgba(0,21,29,.25); cursor: pointer;
      transition: transform .15s ease, background-color .15s ease;
    }
    .music-btn:hover { transform: translateY(-2px); }
    .music-btn[aria-pressed="true"] { background: #ffe9a8; }
    .music-btn .eq { display: none; gap: 2px; align-items: flex-end; height: 12px; }
    .music-btn[aria-pressed="true"] .eq { display: inline-flex; }
    .music-btn .eq i { width: 3px; background: #d64a2e; border-radius: 2px; animation: eq .8s ease-in-out infinite; }
    .music-btn .eq i:nth-child(2) { animation-delay: .2s; }
    .music-btn .eq i:nth-child(3) { animation-delay: .4s; }
    @keyframes eq { 0%,100% { height: 4px; } 50% { height: 12px; } }
  </style>
</head>
<body>
  <iframe id="view" title="FreeYay poster"></iframe>

  <!-- Musik latar: hidup terus, tidak pernah reload saat pindah poster -->
  <audio id="bg-music" src="assets/audio/musik.mp3?v=4" loop preload="none"></audio>
  <button class="music-btn" type="button" aria-pressed="false">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    <span aria-hidden="true">&#9835;</span> <span class="label">Putar musik</span>
  </button>

  <script>
    var view = document.getElementById('view');
    var PAGES = ['mataram','eat','shop','play','enjoy'];
    function pageFromHash() {
      var h = (location.hash || '').replace('#','');
      return (PAGES.indexOf(h) >= 0 ? h : 'mataram') + '.html';
    }
    view.src = pageFromHash();
    view.addEventListener('load', function () {
      try {
        var p = view.contentWindow.location.pathname.split('/').pop().replace('.html','');
        if (p && location.hash.replace('#','') !== p) history.replaceState(null, '', '#' + p);
        if (view.contentDocument && view.contentDocument.title) document.title = view.contentDocument.title;
      } catch (e) {}
    });
    window.addEventListener('hashchange', function () {
      var want = pageFromHash();
      try {
        var cur = view.contentWindow.location.pathname.split('/').pop();
        if (cur !== want) view.src = want;
      } catch (e) { view.src = want; }
    });
  </script>
  <script src="assets/music.js?v=3"></script>
</body>
</html>
